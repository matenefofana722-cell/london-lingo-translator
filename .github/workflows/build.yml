
name: Build AAB Fixed Key
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build
        run: |
          chmod +x gradlew || true
          chmod +x android/gradlew || true
          chmod +x ./android/gradlew || true
          if [ -f "./gradlew" ]; then ./gradlew bundleRelease; exit 0; fi
          if [ -f "android/gradlew" ]; then cd android && ./gradlew bundleRelease; exit 0; fi
          if [ -f "app/gradlew" ]; then cd app && ./gradlew bundleRelease; exit 0; fi
          echo "No gradlew found, trying with gradle directly"
          gradle bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: "**/build/outputs/bundle/release/*.aab"
