name: Build AAB Fixed Key

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          fi
          if [ -f "Woi 1.0.zip" ]; then
            unzip -o "Woi 1.0.zip" -d . || true
          fi

      - name: Create fixed keystore
        run: |
          mkdir -p android/app
          keytool -genkey -v -keystore android/app/release.keystore -alias londonlingo -keyalg RSA -keysize 2048 -validity 10000 -storepass london123 -keypass london123 -dname "CN=London Lingo, OU=London, O=London, L=London, ST=London, C=GB"

      - name: Setup Gradle
        run: |
          cd android || cd */android || true
          chmod +x gradlew
          ./gradlew bundleRelease -Pandroid.injected.signing.store.file=app/release.keystore -Pandroid.injected.signing.store.password=london123 -Pandroid.injected.signing.key.alias=londonlingo -Pandroid.injected.signing.key.password=london123

      - name: Find and upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: |
            **/app-release.aab
            **/*.aab
