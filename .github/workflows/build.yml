name: Build AAB Fixed Key
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Find Android project
        run: |
          GRADLEW=$(find . -type f -name "gradlew" | head -n 1)
          echo "Found gradlew at: $GRADLEW"
          ANDROID_DIR=$(dirname "$GRADLEW")
          echo "ANDROID_DIR=$ANDROID_DIR" >> $GITHUB_ENV
          
      - name: Make gradlew executable
        run: chmod +x $ANDROID_DIR/gradlew
        
      - name: Build AAB
        run: |
          cd $ANDROID_DIR
          ./gradlew bundleRelease
          
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: |
            **/build/outputs/bundle/release/*.aab
            **/outputs/bundle/release/*.aab
