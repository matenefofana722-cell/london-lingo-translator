name: Build AAB Fixed Key
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build
        run: |
          echo "Unzipping..."
          unzip -o "Woi 1.0.zip" -d extracted
          cd extracted
          # find where the real project is
          ls -la
          GRADLEW=$(find . -name "gradlew" -type f | head -n 1)
          echo "Found: $GRADLEW"
          cd $(dirname "$GRADLEW")
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-aab
          path: "**/build/outputs/bundle/release/*.aab"
          if-no-files-found: error
