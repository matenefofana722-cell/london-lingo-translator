unzip -o "Woi 1.0.zip" -d app
ANDROID=$(find app -type d -name android | head -n1)
keytool -genkey -v -keystore $ANDROID/app/my-release-key.jks -alias key -keyalg RSA -keysize 2048 -sigalg SHA256withRSA -validity 10000 -storepass London123 -keypass London123 -dname "CN=London, OU=App, O=App, L=London, S=London, C=GB"
echo "MYAPP_UPLOAD_STORE_FILE=my-release-key.jks
MYAPP_UPLOAD_KEY_ALIAS=key
MYAPP_UPLOAD_STORE_PASSWORD=London123
MYAPP_UPLOAD_KEY_PASSWORD=London123" >> $ANDROID/gradle.properties
cd $(dirname $ANDROID) && npm install
cd android && chmod +x gradlew && ./gradlew bundleRelease
