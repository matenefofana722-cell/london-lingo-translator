name: Build AAB Fixed Key
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Unzip and Build
        run: |
          unzip -o "Woi 1.0.zip" -d .
          GRADLEW=$(find . -name "gradlew" -type f | head -1)
          echo "Found $GRADLEW"
          DIR=$(dirname "$GRADLEW")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: "**/build/outputs/bundle/release/*.aab"
