name: Build AAB Fixed Key
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5

      - name: Build AAB
        run: |
          # Make all possible gradlew executable
          chmod +x gradlew 2>/dev/null || true
          chmod +x android/gradlew 2>/dev/null || true
          chmod +x app/gradlew 2>/dev/null || true
          
          # Build - try every location
          if [ -f "android/gradlew" ]; then
            echo "Building in android/"
            cd android && ./gradlew bundleRelease --stacktrace
          elif [ -f "./gradlew" ]; then
            echo "Building in root"
            ./gradlew bundleRelease --stacktrace
          elif [ -f "app/gradlew" ]; then
            echo "Building in app/"
            cd app && ./gradlew bundleRelease --stacktrace
          else
            echo "No wrapper found, using system gradle"
            if [ -d "android" ]; then cd android; fi
            gradle bundleRelease --stacktrace
          fi

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: |
            **/build/outputs/bundle/release/*.aab
            **/outputs/bundle/release/*.aab
