name: Build AAB - New
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unzip and Build
        run: |
          unzip -o "Woi 1.0.zip" -d ./src
          ROOT=$(find ./src -name "gradlew" -type f | head -1 | xargs dirname | xargs dirname)
          echo "ROOT=$ROOT" >> $GITHUB_ENV
          cd $ROOT
          npm install || yarn install || true
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-aab
          path: "**/build/outputs/bundle/release/*.aab"
